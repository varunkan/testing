[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthsimple-agent"
version = "0.1.0"
description = "Decision-support trading agent with paper trading, news sentiment, and multi-factor signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "feedparser>=6.0",
    "yfinance>=0.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "vaderSentiment>=3.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wealthsimple-agent = "wealthsimple_agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["wealthsimple_agent*"]
